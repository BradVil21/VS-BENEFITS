<style id="hsq-css">
#hsq{margin:18px 0 6px;text-align:left}
#hsq[hidden]{display:none}
#hsq .hsq-h{font-family:Poppins,Inter,sans-serif;font-weight:800;color:#0b2346;font-size:1.08rem;margin:0 0 2px}
#hsq .hsq-sub{font-size:.86rem;color:#5a6b80;margin:0 0 10px;line-height:1.45}
#hsq .hsq-credit{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;border-radius:10px;padding:9px 12px;font-size:.9rem;margin:0 0 10px}
#hsq .hsq-chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
#hsq .hsq-chips button{border:1.5px solid #d6e0ee;background:#fff;color:#16447f;border-radius:999px;padding:6px 12px;font:600 .82rem Inter,sans-serif;cursor:pointer;min-height:34px}
#hsq .hsq-chips button[aria-pressed="true"]{background:#16447f;border-color:#16447f;color:#fff}
#hsq .hsq-card{border:1px solid #e4e9f2;border-radius:12px;padding:12px 14px;margin:0 0 10px;background:#fff}
#hsq .hsq-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
#hsq .hsq-name{font-weight:700;color:#0b2346;font-size:.95rem;line-height:1.3}
#hsq .hsq-iss{font-size:.8rem;color:#5a6b80;margin-top:2px}
#hsq .hsq-price{text-align:right;white-space:nowrap}
#hsq .hsq-price b{display:block;font-size:1.25rem;color:#0b2346;font-family:Poppins,Inter,sans-serif}
#hsq .hsq-price s{font-size:.76rem;color:#94a3b8}
#hsq .hsq-tags{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}
#hsq .hsq-tag{font-size:.7rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;border-radius:6px;padding:3px 7px;background:#f1f5f9;color:#334155}
#hsq .hsq-tag.bronze{background:#f6e7da;color:#7c3f12}#hsq .hsq-tag.silver{background:#eef2f6;color:#334155}#hsq .hsq-tag.gold{background:#fdf3d2;color:#7a5a00}#hsq .hsq-tag.platinum{background:#e8eefc;color:#1e3a8a}#hsq .hsq-tag.hsa{background:#e0f7f4;color:#0f766e}
#hsq .hsq-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:.82rem;color:#334155}
#hsq .hsq-grid span{color:#5a6b80}
#hsq .hsq-act{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
#hsq .hsq-act a.go{background:#16447f;color:#fff;border-radius:999px;padding:8px 14px;font-weight:700;font-size:.84rem;text-decoration:none}
#hsq .hsq-act a.lk{font-size:.8rem;color:#16447f}
#hsq .hsq-more{width:100%;border:1.5px dashed #b9c7da;background:#f7faff;color:#16447f;border-radius:10px;padding:10px;font-weight:700;cursor:pointer;min-height:42px}
#hsq .hsq-load{font-size:.9rem;color:#5a6b80;padding:12px;border:1px dashed #d6e0ee;border-radius:10px}
#hsq .hsq-fine{font-size:.74rem;color:#64748b;line-height:1.5;margin-top:8px}
</style>
<div id="hsq" hidden aria-live="polite"></div>
