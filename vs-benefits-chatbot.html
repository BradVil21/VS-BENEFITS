<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>VS Benefits Chat</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent;font-family:'DM Sans',sans-serif}

#vsb-launcher{
  position:fixed;bottom:24px;left:24px;z-index:2147483646;
  width:62px;height:62px;border-radius:50%;border:none;cursor:pointer;
  background:linear-gradient(135deg,#0b2346 0%,#1e5ab0 50%,#0db5a6 100%);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 24px rgba(11,35,70,.45);
  transition:transform .2s ease,box-shadow .2s ease;
}
#vsb-launcher:hover{transform:scale(1.1);box-shadow:0 10px 32px rgba(11,35,70,.55);}
.vsb-badge{
  position:absolute;top:-2px;right:-2px;
  width:20px;height:20px;border-radius:50%;
  background:#f5b301;border:2.5px solid #fff;
  font-size:11px;font-weight:700;color:#0b2346;
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;
}
.vsb-pulse{
  position:absolute;inset:0;border-radius:50%;
  background:rgba(13,181,166,.35);
  animation:vsbPulse 2s ease-out infinite;
  pointer-events:none;
}
@keyframes vsbPulse{
  0%{transform:scale(1);opacity:.7}
  100%{transform:scale(1.75);opacity:0}
}

#vsb-window{
  position:fixed;bottom:100px;left:24px;z-index:2147483645;
  width:360px;max-width:calc(100vw - 32px);
  height:560px;max-height:calc(100vh - 120px);
  background:#ffffff;border-radius:20px;
  box-shadow:0 24px 64px rgba(11,35,70,.25),0 4px 16px rgba(11,35,70,.12);
  border:1px solid rgba(11,35,70,.1);
  display:none;flex-direction:column;overflow:hidden;
}
#vsb-window.vsb-open{display:flex;}

.vsb-head{
  background:linear-gradient(135deg,#0b2346 0%,#16447f 55%,#0db5a6 100%);
  padding:14px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0;
}
.vsb-ava{
  width:44px;height:44px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,#0db5a6,#f5b301);
  display:flex;align-items:center;justify-content:center;
  font-family:'Syne',sans-serif;font-weight:800;font-size:14px;color:#fff;
  box-shadow:0 2px 8px rgba(0,0,0,.25);position:relative;
}
.vsb-ava-dot{
  position:absolute;bottom:1px;right:1px;
  width:12px;height:12px;border-radius:50%;
  background:#2dbd79;border:2.5px solid #fff;
}
.vsb-head-info{flex:1;min-width:0;}
.vsb-head-name{font-family:'Syne',sans-serif;font-weight:700;font-size:14px;color:#fff;line-height:1.2;}
.vsb-head-status{font-size:11.5px;color:rgba(255,255,255,.75);margin-top:3px;display:flex;align-items:center;gap:5px;}
.vsb-head-status::before{content:"";width:7px;height:7px;border-radius:50%;background:#2dbd79;flex-shrink:0;}
.vsb-closebtn{
  background:rgba(255,255,255,.18);border:none;cursor:pointer;
  width:34px;height:34px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:22px;line-height:1;
  transition:background .15s;flex-shrink:0;
}
.vsb-closebtn:hover{background:rgba(255,255,255,.32);}

.vsb-msgs{
  flex:1;overflow-y:auto;padding:14px 13px 6px;
  display:flex;flex-direction:column;gap:10px;
  scrollbar-width:thin;scrollbar-color:rgba(11,35,70,.12) transparent;
}
.vsb-msgs::-webkit-scrollbar{width:4px;}
.vsb-msgs::-webkit-scrollbar-thumb{background:rgba(11,35,70,.15);border-radius:2px;}

.vsb-row{display:flex;gap:8px;align-items:flex-end;}
.vsb-user{flex-direction:row-reverse;}
.vsb-mini-av{
  width:28px;height:28px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,#0b2346,#0db5a6);
  display:flex;align-items:center;justify-content:center;
  font-family:'Syne',sans-serif;font-weight:800;font-size:9px;color:#fff;
}
.vsb-bubble{max-width:82%;padding:10px 13px;font-size:13.5px;line-height:1.55;word-break:break-word;}
.vsb-bot-bubble{background:#f2f5fb;border-radius:4px 16px 16px 16px;border:1px solid rgba(11,35,70,.07);color:#0e1726;}
.vsb-user-bubble{background:linear-gradient(135deg,#0b2346,#16447f);color:#fff;border-radius:16px 16px 4px 16px;}
.vsb-time{display:block;font-size:10px;color:#9aaac0;margin-top:4px;}
.vsb-user-bubble .vsb-time{color:rgba(255,255,255,.5);}

.vsb-typing{display:flex;gap:5px;padding:11px 14px;background:#f2f5fb;border-radius:4px 16px 16px 16px;border:1px solid rgba(11,35,70,.07);width:fit-content;}
.vsb-typing span{width:7px;height:7px;border-radius:50%;background:#0db5a6;display:block;animation:vsbBounce .75s ease-in-out infinite;}
.vsb-typing span:nth-child(2){animation-delay:.15s;}
.vsb-typing span:nth-child(3){animation-delay:.3s;}
@keyframes vsbBounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}

.vsb-qr{display:flex;flex-wrap:wrap;gap:7px;padding:5px 0 2px;}
.vsb-qbtn{
  background:#fff;border:1.5px solid #0db5a6;
  color:#0b2346;font-family:'DM Sans',sans-serif;font-size:12.5px;font-weight:600;
  padding:7px 12px;border-radius:999px;cursor:pointer;transition:all .15s;
}
.vsb-qbtn:hover{background:#0db5a6;color:#fff;}

.vsb-bottom{padding:10px 12px 12px;border-top:1px solid rgba(11,35,70,.07);background:#fff;flex-shrink:0;}
.vsb-inp-row{display:flex;gap:8px;align-items:flex-end;}
.vsb-inp{
  flex:1;border:1.5px solid rgba(11,35,70,.18);border-radius:12px;
  padding:10px 13px;font-family:'DM Sans',sans-serif;font-size:13.5px;color:#0e1726;
  resize:none;outline:none;background:#fafbfd;transition:border-color .15s;
  min-height:42px;max-height:90px;line-height:1.4;
}
.vsb-inp:focus{border-color:#0db5a6;background:#fff;}
.vsb-inp::placeholder{color:#b0baca;}
.vsb-inp:disabled{opacity:.5;cursor:not-allowed;}
.vsb-sendbtn{
  width:42px;height:42px;border-radius:12px;flex-shrink:0;
  background:linear-gradient(135deg,#0b2346,#0db5a6);
  border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:transform .15s,opacity .15s;
}
.vsb-sendbtn:hover{transform:scale(1.06);}
.vsb-sendbtn:disabled{opacity:.38;cursor:not-allowed;transform:none;}

.vsb-footer{text-align:center;font-size:10px;color:#b0baca;padding:4px 0 3px;flex-shrink:0;}
.vsb-footer b{color:#0db5a6;font-weight:600;}

.vsb-success{
  background:linear-gradient(135deg,#e8f7ef,#f0fdf6);
  border:1.5px solid #9fdabc;border-radius:14px;
  padding:16px;text-align:center;
}
.vsb-success-icon{font-size:34px;margin-bottom:8px;}
.vsb-success h3{font-family:'Syne',sans-serif;font-size:15px;color:#065f46;margin-bottom:6px;}
.vsb-success p{font-size:12.5px;color:#064e3b;line-height:1.6;}
.vsb-success a{color:#0a8754;font-weight:600;}
</style>
</head>
<body>

<!-- LAUNCHER BUBBLE -->
<button id="vsb-launcher" aria-label="Chat with VS Benefits">
  <div class="vsb-pulse"></div>
  <div class="vsb-badge">1</div>
  <svg width="28" height="28" viewBox="0 0 24 24" fill="none" style="pointer-events:none;flex-shrink:0">
    <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z" fill="rgba(255,255,255,.92)"/>
    <path d="M8 10h8M8 14h5" stroke="#0b2346" stroke-width="1.8" stroke-linecap="round"/>
  </svg>
</button>

<!-- CHAT WINDOW -->
<div id="vsb-window">
  <div class="vsb-head">
    <div class="vsb-ava">VS<div class="vsb-ava-dot"></div></div>
    <div class="vsb-head-info">
      <div class="vsb-head-name">Ava &middot; VS Benefits</div>
      <div class="vsb-head-status">Online &middot; Health Insurance Specialist</div>
    </div>
    <button class="vsb-closebtn" id="vsb-close" aria-label="Close">&times;</button>
  </div>
  <div class="vsb-msgs" id="vsb-msgs"></div>
  <div class="vsb-bottom">
    <div class="vsb-inp-row">
      <textarea class="vsb-inp" id="vsb-inp" rows="1" placeholder="Type a message…"></textarea>
      <button class="vsb-sendbtn" id="vsb-send" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="pointer-events:none">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </div>
  <div class="vsb-footer">Powered by <b>VS Benefits</b> AI &nbsp;&middot;&nbsp; Licensed Health Insurance Advisors</div>
</div>

<!-- Firebase compat (global, no ES modules) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
(function(){
"use strict";

/* ─── FIREBASE INIT ─── */
var FB_CFG={
  apiKey:"AIzaSyCbZ7Otrz6yPlxJuLlDPEoMzssgsWkjo5U",
  authDomain:"vs-benefits-c1da9.firebaseapp.com",
  projectId:"vs-benefits-c1da9",
  storageBucket:"vs-benefits-c1da9.firebasestorage.app",
  messagingSenderId:"487471388882",
  appId:"1:487471388882:web:63e98e6699d5a823e3f50b"
};
var fbApp=firebase.apps.length?firebase.apps[0]:firebase.initializeApp(FB_CFG);
var db=firebase.firestore(fbApp);
var fbAuth=firebase.auth(fbApp);
var dbReady=false;
fbAuth.signInAnonymously()
  .then(function(){dbReady=true;})
  .catch(function(e){console.warn("FB auth:",e);});

function genId(){return"chat_"+Math.random().toString(36).slice(2,9)+Date.now().toString(36);}

function saveLead(lead){
  if(!dbReady){console.warn("DB not ready yet");return Promise.resolve(false);}
  return db.collection("vs_state").doc("leads").get().then(function(snap){
    var items=snap.exists?(snap.data().items||[]):[];
    var rec={
      id:genId(),
      firstName:lead.firstName||"",
      lastName:lead.lastName||"",
      name:((lead.firstName||"")+" "+(lead.lastName||"")).trim(),
      email:lead.email||"",
      phone:lead.phone||"",
      dob:lead.dob||"",
      zipcode:lead.zip||"",
      state:lead.state||"",
      coverage:lead.coverageType||"",
      status:"new",
      notes:"Chat lead | Coverage: "+(lead.coverageType||"N/A")+" | Employees: "+(lead.employees||"N/A")+" | ZIP: "+(lead.zip||"N/A")+(lead.extraNotes?" | "+lead.extraNotes:""),
      created:Date.now(),
      updated:Date.now(),
      _source:"chatbot"
    };
    items.unshift(rec);
    return db.collection("vs_state").doc("leads").set({items:items,ts:Date.now()});
  }).then(function(){return true;}).catch(function(e){console.warn("Save lead:",e);return false;});
}

/* ─── DOM ─── */
var launcher=document.getElementById("vsb-launcher");
var win=document.getElementById("vsb-window");
var closeBtn=document.getElementById("vsb-close");
var msgsEl=document.getElementById("vsb-msgs");
var inpEl=document.getElementById("vsb-inp");
var sendBtn=document.getElementById("vsb-send");
var badge=launcher.querySelector(".vsb-badge");
var pulse=launcher.querySelector(".vsb-pulse");

/* ─── STATE ─── */
var isOpen=false;
var isSubmitted=false;
var isBusy=false;
var history=[];
var lead={};

/* ─── TOGGLE ─── */
function openChat(){
  isOpen=true;
  win.classList.add("vsb-open");
  badge.style.display="none";
  pulse.style.display="none";
  inpEl.focus();
  if(!history.length){setTimeout(startChat,350);}
}
function closeChat(){
  isOpen=false;
  win.classList.remove("vsb-open");
  history=[];lead={};isSubmitted=false;isBusy=false;
  msgsEl.innerHTML="";
  inpEl.disabled=false;inpEl.value="";inpEl.style.height="auto";
  inpEl.placeholder="Type a message\u2026";
  sendBtn.disabled=true;
  badge.style.display="flex";
  pulse.style.display="block";
}

launcher.addEventListener("click",function(){isOpen?closeChat():openChat();});
closeBtn.addEventListener("click",closeChat);

/* ─── INPUT ─── */
inpEl.addEventListener("input",function(){
  inpEl.style.height="auto";
  inpEl.style.height=Math.min(inpEl.scrollHeight,90)+"px";
  sendBtn.disabled=!inpEl.value.trim()||isBusy||isSubmitted;
});
inpEl.addEventListener("keydown",function(e){
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();doSend();}
});
sendBtn.addEventListener("click",doSend);

function doSend(){
  var txt=(inpEl.value||"").trim();
  if(!txt||isBusy||isSubmitted)return;
  inpEl.value="";inpEl.style.height="auto";sendBtn.disabled=true;
  addUserMsg(txt);
  chatTurn(txt);
}

/* ─── UI ─── */
function esc(s){return String(s||"").replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
function ts(){var d=new Date();return d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});}
function scroll(){msgsEl.scrollTop=msgsEl.scrollHeight;}

function addUserMsg(txt){
  removeQR();
  var row=document.createElement("div");
  row.className="vsb-row vsb-user";
  var bub=document.createElement("div");
  bub.className="vsb-bubble vsb-user-bubble";
  bub.innerHTML=esc(txt)+'<span class="vsb-time">'+ts()+'</span>';
  row.appendChild(bub);
  msgsEl.appendChild(row);
  scroll();
  history.push({role:"user",content:txt});
}

function addBotMsg(txt){
  var row=document.createElement("div");row.className="vsb-row";
  var av=document.createElement("div");av.className="vsb-mini-av";av.textContent="VS";
  var bub=document.createElement("div");
  bub.className="vsb-bubble vsb-bot-bubble";
  bub.innerHTML=esc(txt).replace(/\n/g,"<br>")+'<span class="vsb-time">'+ts()+'</span>';
  row.appendChild(av);row.appendChild(bub);
  msgsEl.appendChild(row);scroll();
}

function showTyping(){
  var row=document.createElement("div");row.className="vsb-row";row.id="vsb-typing";
  var av=document.createElement("div");av.className="vsb-mini-av";av.textContent="VS";
  var t=document.createElement("div");t.className="vsb-typing";
  t.innerHTML="<span></span><span></span><span></span>";
  row.appendChild(av);row.appendChild(t);
  msgsEl.appendChild(row);scroll();
}
function hideTyping(){var t=document.getElementById("vsb-typing");if(t)t.remove();}

function addQR(opts){
  removeQR();
  var qr=document.createElement("div");qr.className="vsb-qr";qr.id="vsb-qr";
  opts.forEach(function(opt){
    var b=document.createElement("button");b.className="vsb-qbtn";b.textContent=opt;
    b.addEventListener("click",function(){
      removeQR();addUserMsg(opt);chatTurn(opt);
    });
    qr.appendChild(b);
  });
  msgsEl.appendChild(qr);scroll();
}
function removeQR(){var q=document.getElementById("vsb-qr");if(q)q.remove();}

function showSuccess(){
  saveLead(lead);
  var row=document.createElement("div");row.className="vsb-row";
  var av=document.createElement("div");av.className="vsb-mini-av";av.textContent="VS";
  var wrap=document.createElement("div");wrap.style.maxWidth="95%";
  wrap.innerHTML='<div class="vsb-success">'+
    '<div class="vsb-success-icon">\uD83C\uDF89</div>'+
    '<h3>You\'re all set, '+esc(lead.firstName||"there")+'!</h3>'+
    '<p>A licensed VS Benefits advisor will contact you within <strong>1 business day</strong> with your personalized plan options.</p>'+
    '<p style="margin-top:8px">Need help sooner? Call us now:<br>'+
    '<a href="tel:+19548251009">(954) 825-1009</a></p>'+
    '</div><span class="vsb-time">'+ts()+'</span>';
  row.appendChild(av);row.appendChild(wrap);
  msgsEl.appendChild(row);scroll();
  inpEl.disabled=true;
  inpEl.placeholder="Chat complete \u00B7 Call (954) 825-1009";
  sendBtn.disabled=true;
}

/* ─── AI ─── */
var SYSTEM_PROMPT="You are Ava, a warm and knowledgeable health insurance specialist for VS Benefits — a licensed, independent advisory firm based in Miami, FL that serves individuals, families, and small businesses in 40+ states.\n\nYOUR MISSION: Have a friendly, natural conversation to understand the visitor's needs and collect their contact info so a VS Benefits advisor can call them with a personalized quote.\n\nPERSONALITY: Warm, confident, conversational, empathetic. Use their first name once you know it. Keep responses short — 2 to 4 sentences max. Never sound like a form or robot.\n\nQUALIFYING FLOW — collect these naturally across the conversation, not all at once:\n1. Ask their first name to get started\n2. What type of coverage — individual/family, small business, dental/vision, etc.\n3. ZIP code or state (to find available plans)\n4. How many people need coverage (for business: employee count)\n5. Age range or date of birth (for accurate rates)\n6. Email — say 'so I can send you plan options to review'\n7. Phone — say 'so our advisor can reach you directly with your quote'\n8. Any specific concerns or questions?\n\nIMPORTANT RULES:\n- NEVER promise an instant quote — the VS Benefits team will call/email with personalized options\n- If asked about pricing: rates vary by plan, age, and location — the advisor will go over exact numbers on the call\n- If asked about VS Benefits: answer knowledgeably, then redirect to collecting info or calling (954) 825-1009\n- Urgent issue or complaint: empathize and give (954) 825-1009 immediately\n- Services: Group 10-99, Micro group 2-9, ACA/Individual, Family, Dental & Vision, Medicaid guidance\n- Hours: Mon-Fri 8am-6pm ET, Sat-Sun 8am-1pm ET | Miami FL | 40+ states\n- Phone: (954) 825-1009 | Email: bvilsainthealth@gmail.com\n\nWHEN YOU HAVE: name + email + phone + coverage type (minimum required):\nWarmly confirm their info and say the team will reach out within 1 business day.\nAt the very END of your reply append EXACTLY this block — it will NOT be shown to the user:\n<LEAD_DATA>{\"firstName\":\"\",\"lastName\":\"\",\"email\":\"\",\"phone\":\"\",\"zip\":\"\",\"state\":\"\",\"dob\":\"\",\"coverageType\":\"\",\"employees\":\"\",\"extraNotes\":\"\"}</LEAD_DATA>\nFill in every field you collected. Leave others as empty string. Do not invent data.";

function callAPI(messages){
  return fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      model:"claude-sonnet-4-20250514",
      max_tokens:600,
      system:SYSTEM_PROMPT,
      messages:messages
    })
  }).then(function(r){
    if(!r.ok)throw new Error("HTTP "+r.status);
    return r.json();
  }).then(function(d){
    return((d.content||[]).map(function(b){return b.text||"";}).join("")).trim();
  });
}

function startChat(){
  isBusy=true;showTyping();
  var seed=[{role:"user",content:"Hi! I'm visiting the VS Benefits website and want to learn about health insurance options."}];
  callAPI(seed).then(function(reply){
    hideTyping();
    history=seed.concat([{role:"assistant",content:reply}]);
    var display=reply.replace(/<LEAD_DATA>[\s\S]*?<\/LEAD_DATA>/g,"").trim();
    addBotMsg(display||"Hi there! I'm Ava with VS Benefits. I'm here to help you find the right coverage. What type of plan are you looking for?");
    setTimeout(function(){
      addQR(["Individual / Family Plan","Small Business Group","Dental & Vision","I have a question"]);
    },250);
  }).catch(function(){
    hideTyping();
    addBotMsg("Hi there! I'm Ava from VS Benefits. I'm here to help you find the right health insurance plan. What brings you in today?");
    setTimeout(function(){
      addQR(["Individual / Family Plan","Small Business Group","Dental & Vision","I have a question"]);
    },250);
  }).finally(function(){
    isBusy=false;
    sendBtn.disabled=!inpEl.value.trim();
  });
}

function chatTurn(userText){
  if(isBusy)return;
  isBusy=true;sendBtn.disabled=true;showTyping();
  callAPI(history).then(function(reply){
    hideTyping();
    var match=reply.match(/<LEAD_DATA>([\s\S]*?)<\/LEAD_DATA>/);
    var display=reply.replace(/<LEAD_DATA>[\s\S]*?<\/LEAD_DATA>/g,"").trim();
    if(match){
      try{Object.assign(lead,JSON.parse(match[1]));}catch(e){}
    }
    history.push({role:"assistant",content:reply});
    if(match&&!isSubmitted&&lead.email&&lead.phone){
      isSubmitted=true;
      if(display)addBotMsg(display);
      setTimeout(showSuccess,500);
    }else{
      addBotMsg(display||"I'm here to help! Could you tell me a bit more about what you're looking for?");
    }
  }).catch(function(){
    hideTyping();
    addBotMsg("I apologize for the hiccup! Please call us at (954) 825-1009 and our team will assist you right away.");
    history.push({role:"assistant",content:"I apologize for the hiccup! Please call us at (954) 825-1009."});
  }).finally(function(){
    isBusy=false;
    sendBtn.disabled=!inpEl.value.trim()||isSubmitted;
  });
}

})();
</script>
</body>
</html>
