<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VS Benefits Chat Widget</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:transparent}

/* ── LAUNCHER BUBBLE ── */
#vs-launcher{
  position:fixed;bottom:24px;left:24px;z-index:99999;
  width:60px;height:60px;border-radius:50%;
  background:linear-gradient(135deg,#0b2346,#0db5a6);
  border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 20px rgba(11,35,70,.35),0 0 0 0 rgba(13,181,166,.4);
  animation:pulseRing 2.8s ease-in-out infinite;
  transition:transform .2s,box-shadow .2s;
}
#vs-launcher:hover{transform:scale(1.08);box-shadow:0 8px 32px rgba(11,35,70,.4),0 0 0 0 rgba(13,181,166,.3);}
#vs-launcher svg{pointer-events:none;}
#vs-launcher .badge{
  position:absolute;top:-3px;right:-3px;
  width:18px;height:18px;border-radius:50%;
  background:#f5b301;border:2px solid #fff;
  font-size:10px;font-weight:700;color:#0b2346;
  display:flex;align-items:center;justify-content:center;
  font-family:'DM Sans',sans-serif;
}
@keyframes pulseRing{
  0%,70%,100%{box-shadow:0 4px 20px rgba(11,35,70,.35),0 0 0 0 rgba(13,181,166,.4)}
  35%{box-shadow:0 4px 20px rgba(11,35,70,.35),0 0 0 12px rgba(13,181,166,0)}
}

/* ── CHAT WINDOW ── */
#vs-chat{
  position:fixed;bottom:100px;left:24px;z-index:99998;
  width:360px;max-width:calc(100vw - 48px);
  height:560px;max-height:calc(100vh - 140px);
  background:#fff;border-radius:20px;
  box-shadow:0 20px 60px rgba(11,35,70,.22),0 4px 16px rgba(11,35,70,.1);
  display:flex;flex-direction:column;overflow:hidden;
  transform-origin:bottom left;
  transform:scale(0) translateY(20px);opacity:0;
  transition:transform .28s cubic-bezier(.34,1.56,.64,1),opacity .2s;
  border:1px solid rgba(11,35,70,.08);
}
#vs-chat.open{transform:scale(1) translateY(0);opacity:1;}

/* ── HEADER ── */
.vsc-head{
  background:linear-gradient(135deg,#0b2346 0%,#16447f 60%,#0db5a6 100%);
  padding:16px 16px 14px;display:flex;align-items:center;gap:11px;flex-shrink:0;
  position:relative;
}
.vsc-head::after{
  content:"";position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);
}
.vsc-avatar{
  width:42px;height:42px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,#0db5a6,#f5b301);
  display:flex;align-items:center;justify-content:center;
  font-family:'Syne',sans-serif;font-weight:800;font-size:15px;color:#fff;
  box-shadow:0 2px 8px rgba(0,0,0,.2);position:relative;
}
.vsc-online{
  position:absolute;bottom:1px;right:1px;width:11px;height:11px;
  border-radius:50%;background:#2dbd79;border:2px solid #fff;
}
.vsc-head-info{flex:1;min-width:0;}
.vsc-head-name{font-family:'Syne',sans-serif;font-weight:700;font-size:14px;color:#fff;line-height:1.2;}
.vsc-head-sub{font-size:11px;color:rgba(255,255,255,.7);margin-top:2px;display:flex;align-items:center;gap:5px;}
.vsc-head-sub::before{content:"";width:6px;height:6px;border-radius:50%;background:#2dbd79;flex-shrink:0;}
.vsc-close{
  background:rgba(255,255,255,.15);border:none;cursor:pointer;
  width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:18px;transition:background .15s;flex-shrink:0;
}
.vsc-close:hover{background:rgba(255,255,255,.28);}

/* ── MESSAGES ── */
.vsc-msgs{
  flex:1;overflow-y:auto;padding:16px 14px 8px;
  display:flex;flex-direction:column;gap:10px;
  scrollbar-width:thin;scrollbar-color:rgba(11,35,70,.12) transparent;
}
.vsc-msgs::-webkit-scrollbar{width:4px;}
.vsc-msgs::-webkit-scrollbar-thumb{background:rgba(11,35,70,.12);border-radius:2px;}

.msg-row{display:flex;gap:8px;align-items:flex-end;animation:msgIn .22s ease-out both;}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg-row.user{flex-direction:row-reverse;}
.msg-av{
  width:28px;height:28px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,#0b2346,#0db5a6);
  display:flex;align-items:center;justify-content:center;
  font-family:'Syne',sans-serif;font-weight:800;font-size:10px;color:#fff;
}
.msg-bubble{
  max-width:82%;padding:10px 13px;border-radius:16px;
  font-size:13.5px;line-height:1.5;color:#0e1726;
}
.msg-row:not(.user) .msg-bubble{
  background:#f3f6fb;border-radius:4px 16px 16px 16px;
  border:1px solid rgba(11,35,70,.07);
}
.msg-row.user .msg-bubble{
  background:linear-gradient(135deg,#0b2346,#16447f);
  color:#fff;border-radius:16px 16px 4px 16px;
}
.msg-time{font-size:10px;color:#8a9ab5;margin-top:3px;display:block;}
.msg-row.user .msg-time{text-align:right;}

/* typing indicator */
.typing-dot{display:flex;gap:4px;padding:10px 14px;background:#f3f6fb;border-radius:4px 16px 16px 16px;border:1px solid rgba(11,35,70,.07);width:fit-content;}
.typing-dot span{width:7px;height:7px;border-radius:50%;background:#0db5a6;animation:bounce .8s ease-in-out infinite;}
.typing-dot span:nth-child(2){animation-delay:.15s;}
.typing-dot span:nth-child(3){animation-delay:.3s;}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}

/* quick replies */
.quick-replies{display:flex;flex-wrap:wrap;gap:7px;padding:6px 0 2px;}
.qr-btn{
  background:#fff;border:1.5px solid #0db5a6;
  color:#0b2346;font-family:'DM Sans',sans-serif;font-size:12.5px;font-weight:600;
  padding:7px 13px;border-radius:999px;cursor:pointer;transition:all .15s;line-height:1.2;
}
.qr-btn:hover{background:#0db5a6;color:#fff;border-color:#0db5a6;}

/* ── INPUT AREA ── */
.vsc-input-area{
  padding:10px 12px 12px;border-top:1px solid rgba(11,35,70,.07);
  background:#fff;flex-shrink:0;
}
.vsc-input-row{display:flex;gap:8px;align-items:flex-end;}
.vsc-input{
  flex:1;border:1.5px solid rgba(11,35,70,.15);border-radius:12px;
  padding:10px 13px;font-family:'DM Sans',sans-serif;font-size:13.5px;
  color:#0e1726;resize:none;outline:none;background:#fafbfd;
  transition:border-color .15s;min-height:42px;max-height:100px;line-height:1.4;
}
.vsc-input:focus{border-color:#0db5a6;background:#fff;}
.vsc-input::placeholder{color:#a0aec0;}
.vsc-send{
  width:40px;height:40px;border-radius:12px;flex-shrink:0;
  background:linear-gradient(135deg,#0b2346,#0db5a6);
  border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:transform .15s,opacity .15s;
}
.vsc-send:hover{transform:scale(1.06);}
.vsc-send:disabled{opacity:.4;cursor:not-allowed;transform:none;}
.vsc-send svg{pointer-events:none;}

/* ── FORM FIELDS INSIDE CHAT ── */
.chat-form{display:flex;flex-direction:column;gap:8px;padding:4px 0;}
.chat-field{display:flex;flex-direction:column;gap:4px;}
.chat-field label{font-size:11.5px;font-weight:600;color:#5a6b80;text-transform:uppercase;letter-spacing:.05em;}
.chat-field input,.chat-field select{
  padding:9px 11px;border:1.5px solid rgba(11,35,70,.15);border-radius:10px;
  font-family:'DM Sans',sans-serif;font-size:13.5px;color:#0e1726;
  background:#fff;outline:none;transition:border-color .15s;
}
.chat-field input:focus,.chat-field select:focus{border-color:#0db5a6;}
.chat-submit{
  background:linear-gradient(135deg,#0b2346,#0db5a6);color:#fff;
  border:none;border-radius:10px;padding:11px;font-family:'DM Sans',sans-serif;
  font-size:14px;font-weight:600;cursor:pointer;margin-top:4px;
  transition:opacity .15s,transform .15s;
}
.chat-submit:hover{opacity:.9;transform:translateY(-1px);}

/* ── BRANDING FOOTER ── */
.vsc-brand{
  text-align:center;font-size:10.5px;color:#a0aec0;padding:5px 0 3px;
  letter-spacing:.03em;flex-shrink:0;
}
.vsc-brand span{color:#0db5a6;font-weight:600;}

/* ── SUCCESS STATE ── */
.success-box{
  background:linear-gradient(135deg,#e6f7ef,#f0fff9);
  border:1.5px solid #b9e6cf;border-radius:14px;
  padding:16px;text-align:center;
}
.success-box .success-icon{font-size:32px;margin-bottom:8px;}
.success-box h3{font-family:'Syne',sans-serif;font-size:15px;color:#0a5030;margin-bottom:4px;}
.success-box p{font-size:12.5px;color:#2d6a4f;line-height:1.5;}
</style>
</head>
<body>

<!-- LAUNCHER BUBBLE -->
<button id="vs-launcher" aria-label="Chat with VS Benefits">
  <span class="badge">1</span>
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M12 2C6.48 2 2 6.02 2 11c0 2.65 1.23 5.02 3.18 6.71L4 22l4.44-2.22A10.23 10.23 0 0012 20c5.52 0 10-4.02 10-9S17.52 2 12 2z" fill="rgba(255,255,255,.9)"/>
    <path d="M8 11h1m3 0h1m3 0h1" stroke="#0b2346" stroke-width="2" stroke-linecap="round"/>
  </svg>
</button>

<!-- CHAT WINDOW -->
<div id="vs-chat" role="dialog" aria-label="VS Benefits Chat" aria-modal="false">
  <!-- HEADER -->
  <div class="vsc-head">
    <div class="vsc-avatar">VS<div class="vsc-online"></div></div>
    <div class="vsc-head-info">
      <div class="vsc-head-name">VS Benefits Assistant</div>
      <div class="vsc-head-sub">Online · Typically replies instantly</div>
    </div>
    <button class="vsc-close" id="vs-close" aria-label="Close chat">×</button>
  </div>

  <!-- MESSAGES -->
  <div class="vsc-msgs" id="vs-msgs"></div>

  <!-- INPUT -->
  <div class="vsc-input-area">
    <div class="vsc-input-row">
      <textarea class="vsc-input" id="vs-input" rows="1" placeholder="Type a message…" aria-label="Chat message"></textarea>
      <button class="vsc-send" id="vs-send" aria-label="Send message">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </div>
  <div class="vsc-brand">Powered by <span>VS Benefits</span> · AI Assistant</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCbZ7Otrz6yPlxJuLlDPEoMzssgsWkjo5U",
  authDomain: "vs-benefits-c1da9.firebaseapp.com",
  projectId: "vs-benefits-c1da9",
  storageBucket: "vs-benefits-c1da9.firebasestorage.app",
  messagingSenderId: "487471388882",
  appId: "1:487471388882:web:63e98e6699d5a823e3f50b"
};

const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
const auth = getAuth(fbApp);

let dbReady = false;
(async () => {
  try { await signInAnonymously(auth); dbReady = true; } catch(e) { console.warn("Firebase auth failed", e); }
})();

async function saveLead(lead) {
  if (!dbReady) return false;
  try {
    const leadsDoc = await getDoc(doc(db, "vs_state", "leads"));
    const existing = leadsDoc.exists() ? (leadsDoc.data().items || []) : [];
    const newLead = {
      id: "chat_" + Math.random().toString(36).slice(2,10) + Date.now().toString(36),
      firstName: lead.firstName || "",
      lastName: lead.lastName || "",
      name: ((lead.firstName||"") + " " + (lead.lastName||"")).trim(),
      email: lead.email || "",
      phone: lead.phone || "",
      dob: lead.dob || "",
      zipcode: lead.zip || "",
      state: lead.state || "",
      coverage: lead.coverageType || "",
      status: "new",
      notes: "Chat lead. Employees: " + (lead.employees||"N/A") + ". Coverage type: " + (lead.coverageType||"N/A") + ". ZIP: " + (lead.zip||"N/A") + ". Message: " + (lead.extraNotes||""),
      created: Date.now(),
      updated: Date.now(),
      _source: "chatbot"
    };
    existing.unshift(newLead);
    await setDoc(doc(db, "vs_state", "leads"), { items: existing, ts: Date.now() });
    return true;
  } catch(e) { console.warn("Save lead failed", e); return false; }
}

// ── CHATBOT ENGINE ──
const ANTHROPIC_URL = "https://api.anthropic.com/v1/messages";

const SYSTEM_PROMPT = `You are Ava, a friendly and professional health insurance specialist assistant for VS Benefits — a licensed, independent health insurance advisory firm based in Miami, FL, serving individuals, families, and small businesses in 40+ states.

YOUR GOAL: Qualify the visitor as a potential client by having a warm, natural conversation. Gather their information so the VS Benefits team can call them with a personalized quote.

TONE: Warm, confident, helpful, and conversational. Never sound robotic or like a form. Be empathetic. Use first names once you know them.

QUALIFYING FLOW (follow this naturally, not rigidly):
1. Greet warmly, ask for their first name
2. Ask what brings them in today (individual/family coverage, group/business, dental, etc.)
3. Ask how many people need coverage (for business: how many employees)
4. Ask for their ZIP code or state
5. Ask for their email address — say "so we can send you plan options"
6. Ask for their phone number — say "so our advisor can reach you with your personalized quote"
7. Ask their date of birth or age range (to find accurate rates)
8. Optional: any specific concerns or questions?
9. Confirm all info, tell them the team will be in touch within 1 business day

RULES:
- Collect: first name, last name, email, phone, ZIP/state, DOB or age, coverage type (individual/family/group), number of employees if business
- NEVER claim you can provide an instant quote — always say the VS Benefits team will call/email with personalized options
- If they ask about pricing: say rates vary by plan and location, and the advisor will go over exact numbers
- If they ask about VS Benefits (who you are, services, etc.): answer knowledgeably but end by encouraging them to call (954) 825-1009 or continue the chat
- If they have complaints or urgent issues: empathize, give the number (954) 825-1009
- Keep responses SHORT (2-4 sentences max). Don't overwhelm.
- When you have enough info (name, email, phone, ZIP, coverage type), say you're submitting their info and the team will reach out. Include a JSON block at the END of your message like this (hidden from user, parsed by system):
<LEAD_DATA>{"firstName":"...","lastName":"...","email":"...","phone":"...","zip":"...","state":"...","dob":"...","coverageType":"...","employees":"...","extraNotes":"..."}</LEAD_DATA>

VS Benefits services: Group insurance (10-99 employees), Micro group (2-9), ACA/Individual, Family plans, Dental & Vision, Medicaid guidance. Based in Miami FL, licensed in 40+ states. Phone: (954) 825-1009. Email: bvilsainthealth@gmail.com. Hours: Mon-Fri 8am-6pm ET, Sat-Sun 8am-1pm ET.`;

let conversationHistory = [];
let isOpen = false;
let isSubmitted = false;
let collectedLead = {};

function uid() { return "id_" + Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
function now() {
  const d = new Date();
  return d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
}

const launcher = document.getElementById("vs-launcher");
const chat = document.getElementById("vs-chat");
const closeBtn = document.getElementById("vs-close");
const msgsEl = document.getElementById("vs-msgs");
const inputEl = document.getElementById("vs-input");
const sendBtn = document.getElementById("vs-send");

launcher.addEventListener("click", () => {
  isOpen = !isOpen;
  chat.classList.toggle("open", isOpen);
  if (isOpen) {
    launcher.querySelector(".badge").style.display = "none";
    inputEl.focus();
    if (conversationHistory.length === 0) {
      setTimeout(() => sendBotMessage(null), 400);
    }
  }
});

closeBtn.addEventListener("click", () => {
  isOpen = false;
  chat.classList.remove("open");
  // Reset session
  conversationHistory = [];
  collectedLead = {};
  isSubmitted = false;
  msgsEl.innerHTML = "";
});

sendBtn.addEventListener("click", handleSend);
inputEl.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); handleSend(); }
});
inputEl.addEventListener("input", () => {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 100) + "px";
});

function handleSend() {
  const text = inputEl.value.trim();
  if (!text || isSubmitted) return;
  addUserMsg(text);
  inputEl.value = "";
  inputEl.style.height = "auto";
  sendBotMessage(text);
}

function addUserMsg(text) {
  const row = document.createElement("div");
  row.className = "msg-row user";
  row.innerHTML = `<div class="msg-bubble">${escHtml(text)}<span class="msg-time">${now()}</span></div>`;
  msgsEl.appendChild(row);
  msgsEl.scrollTop = msgsEl.scrollHeight;
  conversationHistory.push({ role: "user", content: text });
}

function addBotMsg(html, isHtml = false) {
  const row = document.createElement("div");
  row.className = "msg-row";
  const av = document.createElement("div");
  av.className = "msg-av";
  av.textContent = "VS";
  const bubble = document.createElement("div");
  bubble.className = "msg-bubble";
  if (isHtml) bubble.innerHTML = html + `<span class="msg-time">${now()}</span>`;
  else bubble.innerHTML = escHtml(html).replace(/\n/g, "<br>") + `<span class="msg-time">${now()}</span>`;
  row.appendChild(av);
  row.appendChild(bubble);
  msgsEl.appendChild(row);
  msgsEl.scrollTop = msgsEl.scrollHeight;
}

function showTyping() {
  const row = document.createElement("div");
  row.className = "msg-row";
  row.id = "typing-indicator";
  const av = document.createElement("div");
  av.className = "msg-av";
  av.textContent = "VS";
  const dots = document.createElement("div");
  dots.className = "typing-dot";
  dots.innerHTML = "<span></span><span></span><span></span>";
  row.appendChild(av);
  row.appendChild(dots);
  msgsEl.appendChild(row);
  msgsEl.scrollTop = msgsEl.scrollHeight;
}

function hideTyping() {
  const t = document.getElementById("typing-indicator");
  if (t) t.remove();
}

function addQuickReplies(options, onSelect) {
  const qr = document.createElement("div");
  qr.className = "quick-replies";
  qr.id = "quick-replies";
  options.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "qr-btn";
    btn.textContent = opt;
    btn.addEventListener("click", () => {
      document.getElementById("quick-replies")?.remove();
      addUserMsg(opt);
      sendBotMessage(opt);
    });
    qr.appendChild(btn);
  });
  msgsEl.appendChild(qr);
  msgsEl.scrollTop = msgsEl.scrollHeight;
}

function escHtml(s) {
  return String(s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

async function sendBotMessage(userText) {
  document.getElementById("quick-replies")?.remove();
  sendBtn.disabled = true;
  showTyping();

  const messages = userText === null
    ? [{ role: "user", content: "Hello, I'm visiting the VS Benefits website and I'd like to learn more about health insurance options." }]
    : conversationHistory;

  try {
    const resp = await fetch(ANTHROPIC_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1000,
        system: SYSTEM_PROMPT,
        messages: messages
      })
    });

    const data = await resp.json();
    hideTyping();

    const fullText = (data.content || []).map(b => b.text || "").join("").trim();

    // Check for lead data
    const leadMatch = fullText.match(/<LEAD_DATA>([\s\S]*?)<\/LEAD_DATA>/);
    let displayText = fullText.replace(/<LEAD_DATA>[\s\S]*?<\/LEAD_DATA>/g, "").trim();

    if (leadMatch && !isSubmitted) {
      try {
        const parsed = JSON.parse(leadMatch[1]);
        Object.assign(collectedLead, parsed);
      } catch(e) {}
    }

    conversationHistory.push({ role: "assistant", content: fullText });

    if (leadMatch && !isSubmitted && collectedLead.email && collectedLead.phone) {
      isSubmitted = true;
      addBotMsg(displayText || "Perfect! I have everything I need.");
      setTimeout(() => showSuccessState(), 800);
    } else {
      addBotMsg(displayText);

      // Suggest quick replies based on context
      if (userText === null) {
        setTimeout(() => addQuickReplies(["Individual / Family Plan", "Small Business Group", "Dental & Vision", "Medicare / Medicaid"], null), 300);
      } else if (fullText.toLowerCase().includes("medicare") || fullText.toLowerCase().includes("medicaid")) {
        setTimeout(() => addQuickReplies(["Yes, tell me more", "Call me: (954) 825-1009", "I have another question"], null), 300);
      }
    }
  } catch(err) {
    hideTyping();
    addBotMsg("I'm sorry, I'm having a moment. Please call us directly at (954) 825-1009 and we'll help you right away! 😊");
  }

  sendBtn.disabled = false;
}

async function showSuccessState() {
  const saved = await saveLead(collectedLead);

  const successRow = document.createElement("div");
  successRow.className = "msg-row";
  const av = document.createElement("div");
  av.className = "msg-av";
  av.textContent = "VS";
  const bubble = document.createElement("div");
  bubble.className = "msg-bubble";
  bubble.style.maxWidth = "95%";
  bubble.style.background = "transparent";
  bubble.style.border = "none";
  bubble.style.padding = "4px 0";
  bubble.innerHTML = `
    <div class="success-box">
