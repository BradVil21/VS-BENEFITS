<style id="vs-quad-css">
.vsq{max-width:860px;margin:0 auto;font-family:inherit}
.vsq-row{display:grid;grid-template-columns:120px 1fr 120px;align-items:center;gap:14px}
.vsq-side{font-size:.78rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;line-height:1.3;display:flex;align-items:center;gap:10px;height:100%}
.vsq-side.l{color:#0f766e;justify-content:flex-end;text-align:right}.vsq-side.r{color:#16447f}
.vsq-side .br{flex:0 0 14px;height:78%;border:3px solid currentColor}
.vsq-side.l .br{border-right:0;border-radius:10px 0 0 10px;order:2}.vsq-side.r .br{border-left:0;border-radius:0 10px 10px 0}
.vsq-grid{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vsq-q{border-radius:18px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;padding:18px 20px;font-weight:800;font-size:.86rem;letter-spacing:.03em;line-height:1.35;text-transform:uppercase;text-decoration:none}
.vsq-q:hover{color:#fff;filter:brightness(1.06);text-decoration:none}
.vsq-q .ic{width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.95);display:flex;align-items:center;justify-content:center;margin-bottom:9px}
.vsq-t{background:linear-gradient(135deg,#0db5a6,#0f8f8f)}.vsq-t .ic{color:#0f766e}
.vsq-n{background:linear-gradient(135deg,#16447f,#0b2346)}.vsq-n .ic{color:#16447f}
.vsq-q.top{padding-bottom:34px}.vsq-q.bot{padding-top:34px}
.vsq-c{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;color:#0b2346;border-radius:12px;box-shadow:0 6px 20px -8px rgba(11,35,70,.45);padding:11px 22px;font-weight:800;font-size:.85rem;letter-spacing:.08em;white-space:nowrap;z-index:2}
.vsq-cap{font-size:.82rem;color:var(--muted,#5a6b80);text-align:center;margin:12px 0 0}
.vsq-leg{display:none}
@media(max-width:700px){.vsq-row{grid-template-columns:1fr}.vsq-side{display:none}
.vsq-leg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:8px}.vsq-leg span{font-size:.68rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;text-align:center;padding:6px 4px;border-radius:999px}
.vsq-leg .l{color:#0f766e;background:#e6fbf8}.vsq-leg .r{color:#16447f;background:#e8eef8}
.vsq-q{min-height:118px;font-size:.72rem;padding:14px 10px}.vsq-q.top{padding-bottom:30px}.vsq-q.bot{padding-top:30px}.vsq-c{font-size:.7rem;padding:9px 14px}}
</style>
<figure class="vsq" aria-label="The four types of health insurance plans">

  <div class="vsq-row">
    <div class="vsq-side l">The private market<span class="br"></span></div>
    <div class="vsq-grid">
      <a class="vsq-q vsq-t top" href="/short-term-health-insurance"><span class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>Short-term plans, discount plans, minimal essential coverage (MEC)</a>
      <a class="vsq-q vsq-n top" href="/aca-subsidy-calculator"><span class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg></span>ACA plans</a>
      <a class="vsq-q vsq-t bot" href="/private-health-insurance"><span class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg></span>Medically underwritten</a>
      <a class="vsq-q vsq-n bot" href="/small-business-health-insurance"><span class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></span>Employer plans</a>
      <div class="vsq-c">INSURANCE PRODUCTS</div>
    </div>
    <div class="vsq-side r"><span class="br"></span>Guaranteed issue</div>
  </div>
</figure>
